<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zab-Tube Video Player</title>
    <style>
        body { background-color: #0f0f0f; color: white; margin: 0; font-family: Roboto, Arial; }
        
        /* Video Section */
        .video-container { width: 100%; position: sticky; top: 0; background: black; z-index: 10; }
        video { width: 100%; aspect-ratio: 16 / 9; }

        /* Video Info like Screenshot 2 */
        .content-padding { padding: 12px; }
        .video-title { font-size: 18px; font-weight: bold; line-height: 1.4; margin-bottom: 8px; }
        .stats { font-size: 13px; color: #aaa; margin-bottom: 15px; }

        /* Channel Section */
        .channel-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .channel-info { display: flex; align-items: center; gap: 10px; }
        .channel-logo { width: 35px; height: 35px; border-radius: 50%; background: #333; }
        .subscribe-btn { background: white; color: black; padding: 8px 15px; border-radius: 20px; font-weight: bold; border: none; }

        /* Interaction Buttons like Screenshot 2 */
        .action-buttons { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .btn { background: #272727; padding: 8px 15px; border-radius: 20px; font-size: 13px; white-space: nowrap; }

        /* Comment Section like Screenshot 2 */
        .comment-preview { background: #272727; padding: 12px; border-radius: 12px; margin-top: 15px; }
        .comment-header { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .comment-text { font-size: 13px; color: #eee; }

        /* Recommendation Section */
        .next-video { display: flex; gap: 10px; margin-top: 20px; }
        .small-thumb { width: 140px; height: 80px; border-radius: 8px; background: #333; }
    </style>
</head>
<body>

    <div class="video-container">
        <video controls poster="https://via.placeholder.com/640x360/000/fff?text=Zab-Tube+Video">
            </video>
    </div>

    <div class="content-padding">
        <div class="video-title">Chand Sitare - Kaho Naa Pyaar Hai | Hrithik Roshan & Amisha Patel | Zab-Tube Classics</div>
        <div class="stats">1.3 crore views • 1 yr ago ...more</div>

        <div class="channel-bar">
            <div class="channel-info">
                <div class="channel-logo"></div>
                <div>
                    <div style="font-weight:bold; font-size:14px;">ZMC Classic</div>
                    <div style="font-size:12px; color:#aaa;">2M subscribers</div>
                </div>
            </div>
            <button class="subscribe-btn">Subscribe</button>
        </div>

        <div class="action-buttons">
            <div class="btn">👍 56K | 👎</div>
            <div class="btn">↪️ Share</div>
            <div class="btn">⬇️ Download</div>
            <div class="btn">➕ Save</div>
        </div>

        <div class="comment-preview">
            <div class="comment-header">Comments 694</div>
            <div class="comment-text">
                <span style="font-weight:bold;">User:</span> Are yaar ap meri tareef jyada nahi kiya kijiye...
            </div>
        </div>

        <div class="next-video">
            <div class="small-thumb"></div>
            <div>
                <div style="font-size:14px; font-weight:500;">Next Hit Song 2026</div>
                <div style="font-size:12px; color:#aaa;">Zab Music • 10M views</div>
            </div>
        </div>
    </div>

</body>
</html>
