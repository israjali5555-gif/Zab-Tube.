<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zab-Tube | Profile Sync</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f0f0f; color: white; font-family: 'Roboto', Arial, sans-serif; }

        /* --- HEADER --- */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 15px; position: sticky; top: 0; background: #0f0f0f; z-index: 1000; 
        }
        .logo { font-size: 20px; font-weight: bold; color: #fff; }
        .logo span { color: #ff0000; }
        
        .header-icons { display: flex; gap: 18px; align-items: center; }
        .icon-white { color: white !important; font-size: 20px; cursor: pointer; }

        /* Gol Profile Photo Style (Header & Video) */
        .user-pfp { 
            width: 32px; height: 32px; border-radius: 50%; 
            object-fit: cover; border: 1px solid #444; background: #222;
        }

        .categories { display: flex; gap: 10px; overflow-x: auto; padding: 10px 15px; background: #0f0f0f; scrollbar-width: none; }
        .chip { background: #272727; padding: 7px 15px; border-radius: 8px; font-size: 14px; white-space: nowrap; }
        .chip.active { background: white; color: black; }

        /* --- VIDEO LIST --- */
        .main-feed { padding-bottom: 70px; }
        .video-item { margin-bottom: 25px; text-decoration: none; color: white; display: block; }
        .thumb-wrap { position: relative; width: 100%; }
        .thumb-wrap img { width: 100%; display: block; }
        .time-tag { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; font-size: 12px; }

        .video-info { display: flex; padding: 12px; gap: 12px; }
        /* Video ke niche wali gol photo */
        .video-pfp { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #333; }
        
        .v-title { font-size: 15px; font-weight: 500; line-height: 1.3; margin-bottom: 4px; }
        .v-meta { font-size: 12px; color: #aaa; }

        /* --- BOTTOM BAR --- */
        .bottom-bar { 
            position: fixed; bottom: 0; width: 100%; background: #0f0f0f; 
            display: flex; justify-content: space-around; padding: 8px 0; 
            border-top: 1px solid #272727; z-index: 1001;
        }
        .nav-tab { text-align: center; color: white; text-decoration: none; flex: 1; font-size: 11px; }
        .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }
        .nav-pfp { width: 24px; height: 24px; border-radius: 50%; margin: 0 auto 2px auto; display: block; border: 1px solid white; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>►</span> Zab-Tube</div>
        <div class="header-icons">
            <span class="icon-white">🔍</span>
            <span class="icon-white">🔔</span>
            <img src="https://www.w3schools.com/howto/img_avatar.png" class="user-pfp" id="header-profile">
        </div>
    </header>

    <div class="categories">
        <div class="chip active">All</div>
        <div class="chip">Music</div>
        <div class="chip">Gaming</div>
        <div class="chip">Bhojpuri</div>
    </div>

    <div class="main-feed" id="video-feed">
        </div>

    <div class="bottom-bar">
        <a href="index.html" class="nav-tab"><span class="nav-icon">🏠</span>Home</a>
        <a href="#" class="nav-tab"><span class="nav-icon">⚡</span>Shorts</a>
        <div class="nav-tab" style="font-size: 30px; margin-top: -8px;">+</div>
        <a href="#" class="nav-tab"><span class="nav-icon">📺</span>Subs</a>
        <a href="you.html" class="nav-tab">
            <img src="https://www.w3schools.com/howto/img_avatar.png" class="nav-pfp" id="bottom-profile">
            You
        </a>
    </div>

    <script>
    // User ki photo ka link (Jab login hoga toh yahan link badal jayega)
    const userPhoto = "https://www.w3schools.com/howto/img_avatar.png";

    async function loadVideos() {
        const feed = document.getElementById('video-feed');
        const fetchUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id=UC_x5XG1OV2P6uYZ5FSM9P_Q')}`;

        try {
            const res = await fetch(fetchUrl);
            const data = await res.json();
            if(data.items) {
                feed.innerHTML = '';
                data.items.forEach(item => {
                    const vId = item.guid.split(':').pop();
                    feed.innerHTML += `
                        <div class="video-item" onclick="location.href='player.html?v=${vId}'">
                            <div class="thumb-wrap">
                                <img src="${item.thumbnail}">
                                <div class="time-tag">10:20</div>
                            </div>
                            <div class="video-info">
                                <img src="${userPhoto}" class="video-pfp">
                                <div style="flex:1;">
                                    <div class="v-title">${item.title}</div>
                                    <div class="v-meta">Zab-Tube • 1.5M views</div>
                                </div>
                            </div>
                        </div>`;
                });
            }
        } catch(e) { console.log("Error!"); }
    }
    window.onload = loadVideos;
    </script>
</body>
</html>
