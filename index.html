<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zab-Tube | Unique Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #080808; color: white; font-family: 'Poppins', sans-serif; }

        /* --- UNIQUE HEADER DESIGN --- */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 18px; position: sticky; top: 0; background: rgba(8, 8, 8, 0.95); 
            z-index: 1000; border-bottom: 1px solid #1a1a1a;
        }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: -1px; }
        .logo span { color: #ff0033; }
        
        .header-actions { display: flex; gap: 12px; }
        /* Search aur Bell ek hi style mein */
        .btn-round { 
            background: #1a1a1a; width: 42px; height: 42px; 
            border-radius: 12px; display: flex; align-items: center; 
            justify-content: center; font-size: 18px; cursor: pointer;
            border: 1px solid #222; transition: 0.3s;
        }
        .btn-round:active { transform: scale(0.9); background: #333; }

        /* --- CATEGORIES --- */
        .categories { 
            display: flex; gap: 10px; overflow-x: auto; padding: 12px 15px; 
            background: #080808; scrollbar-width: none; 
        }
        .categories::-webkit-scrollbar { display: none; }
        .chip { 
            background: #1a1a1a; padding: 8px 18px; border-radius: 10px; 
            font-size: 14px; white-space: nowrap; color: #ccc; border: 1px solid #222;
        }
        .chip.active { background: #ff0033; color: white; border: none; }

        /* --- VIDEO FEED --- */
        .main-feed { padding: 5px 0 90px 0; }
        .video-card { width: 100%; margin-bottom: 25px; cursor: pointer; }
        .thumb-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; }
        .thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Duration/Timing Tag */
        .duration { 
            position: absolute; bottom: 10px; right: 10px; 
            background: rgba(0,0,0,0.8); padding: 3px 8px; 
            border-radius: 6px; font-size: 12px; font-weight: bold; 
        }

        .video-info { display: flex; padding: 12px 15px; gap: 15px; }
        .profile-img { width: 40px; height: 40px; border-radius: 12px; background: #222; flex-shrink: 0; }
        .v-details { flex: 1; }
        .v-title { font-size: 16px; font-weight: 600; line-height: 1.3; color: #fff; margin-bottom: 5px; }
        .v-meta { font-size: 12px; color: #888; }

        /* --- BOTTOM NAVIGATION (UNIQUE STYLE) --- */
        .bottom-bar { 
            position: fixed; bottom: 0; width: 100%; background: #080808; 
            display: flex; justify-content: space-around; align-items: center; 
            padding: 10px 0; border-top: 1px solid #1a1a1a; z-index: 1001;
        }
        .nav-link { text-align: center; color: #888; text-decoration: none; font-size: 11px; flex: 1; }
        .nav-link.active { color: #fff; }
        .nav-link i { font-size: 22px; display: block; margin-bottom: 3px; }

        /* Plus Button - Center Unique */
        .plus-btn { 
            background: #ff0033; width: 48px; height: 48px; 
            border-radius: 15px; display: flex; align-items: center; 
            justify-content: center; font-size: 28px; color: white; 
            box-shadow: 0 4px 15px rgba(255, 0, 51, 0.3); margin-top: -20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>Z</span>ab-Tube</div>
        <div class="header-actions">
            <div class="btn-round">🔍</div>
            <div class="btn-round">🔔</div>
            <div class="btn-round">👤</div>
        </div>
    </header>

    <div class="categories">
        <div class="chip active">Home</div>
        <div class="chip">Maha Library</div>
        <div class="chip">Shorts</div>
        <div class="chip">Bhojpuri</div>
        <div class="chip">Music</div>
        <div class="chip">Gaming</div>
    </div>

    <div class="main-feed" id="feed">
        </div>

    <div class="bottom-bar">
        <a href="#" class="nav-link active">🏠<br>Home</a>
        <a href="#" class="nav-link">⚡<br>Shorts</a>
        <div class="plus-btn">+</div>
        <a href="#" class="nav-link">📺<br>Subs</a>
        <a href="#" class="nav-link">📂<br>You</a>
    </div>

    <script>
        const myData = [
            { id: 'Ks-_MzkzoQg', title: 'Blockbuster Hit: Zab-Tube Special 2024', time: '05:40', thumb: 'https://img.youtube.com/vi/Ks-_MzkzoQg/maxresdefault.jpg' },
            { id: '3JZ_D3ELwOQ', title: 'South Action Movie | Dubbed Hindi Full', time: '02:15:22', thumb: 'https://img.youtube.com/vi/3JZ_D3ELwOQ/maxresdefault.jpg' },
            { id: 'dQw4w9WgXcQ', title: 'Trending Bhojpuri Hits Collection', time: '12:00', thumb: 'https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg' },
            { id: 'yJg-Y5byMMw', title: 'New Punjabi Beat - Official Music', time: '03:15', thumb: 'https://img.youtube.com/vi/yJg-Y5byMMw/maxresdefault.jpg' }
        ];

        const feed = document.getElementById('feed');
        myData.forEach(v => {
            feed.innerHTML += `
                <div class="video-card" onclick="location.href='player.html?v=${v.id}'">
                    <div class="thumb-wrapper">
                        <img src="${v.thumb}">
                        <div class="duration">${v.time}</div>
                    </div>
                    <div class="video-info">
                        <div class="profile-img"></div>
                        <div class="v-details">
                            <div class="v-title">${v.title}</div>
                            <div class="v-meta">Zab-Tube • 500K views • 20 mins ago</div>
                        </div>
                    </div>
                </div>`;
        });
    </script>
</body>
</html>
