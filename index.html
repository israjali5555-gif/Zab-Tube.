<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zab-Tube | Official</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f0f0f; color: white; font-family: 'Roboto', Arial, sans-serif; overflow-x: hidden; }
        
        /* Header & Search */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 15px; position: sticky; top: 0; background: #0f0f0f; z-index: 1000; 
        }
        .logo { font-size: 20px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 5px; }
        .logo span { color: #ff0000; font-size: 24px; }
        .search-container { display: flex; background: #222; border-radius: 20px; padding: 5px 15px; width: 50%; }
        .search-container input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 14px; }

        /* Categories */
        .categories { 
            display: flex; gap: 10px; overflow-x: auto; padding: 10px 15px; 
            background: #0f0f0f; scrollbar-width: none; position: sticky; top: 50px; z-index: 999;
        }
        .categories::-webkit-scrollbar { display: none; }
        .chip { background: #272727; padding: 7px 15px; border-radius: 8px; font-size: 14px; white-space: nowrap; cursor: pointer; }
        .chip.active { background: white; color: black; }

        /* Video Feed Area */
        .main-feed { padding-bottom: 80px; min-height: 100vh; }
        .video-item { margin-bottom: 20px; text-decoration: none; color: white; display: block; }
        .thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #222; }
        .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        .video-info { display: flex; padding: 12px; gap: 12px; }
        .chan-img { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(45deg, #f00, #500); flex-shrink: 0; }
        .v-title { font-size: 14px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .v-meta { font-size: 12px; color: #aaa; margin-top: 4px; }

        /* Bottom Navigation */
        .bottom-bar { 
            position: fixed; bottom: 0; width: 100%; background: #0f0f0f; 
            display: flex; justify-content: space-around; padding: 10px 0; 
            border-top: 1px solid #272727; z-index: 1001;
        }
        .nav-tab { text-align: center; color: white; text-decoration: none; font-size: 10px; opacity: 0.8; }
        .nav-tab.active { opacity: 1; }
        .nav-tab i { font-size: 20px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>►</span> Zab-Tube</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Zab-Tube...">
        </div>
        <div style="font-size: 18px;">🔔</div>
    </header>

    <div class="categories" id="categoryBox">
        <div class="chip active">All</div>
        <div class="chip">New to you</div>
        <div class="chip">Music</div>
        <div class="chip">Bhojpuri</div>
        <div class="chip">South Movie</div>
        <div class="chip">Punjabi</div>
        <div class="chip">Hollywood</div>
        <div class="chip">Serials</div>
    </div>

    <div class="main-feed" id="video-feed">
        <p style="text-align:center; padding:50px; color:#aaa;">Maha Library Load Ho Rahi Hai...</p>
    </div>

    <div class="bottom-bar">
        <a href="index.html" class="nav-tab active">🏠<br>Home</a>
        <a href="shorts.html" class="nav-tab">⚡<br>Shorts</a>
        <div class="nav-tab" style="font-size: 25px; margin-top: -5px;">+</div>
        <a href="#" class="nav-tab">📺<br>Subs</a>
        <a href="you.html" class="nav-tab">👤<br>You</a>
    </div>

    <script>
    // 10+ Maha Channels List
    const channelList = [
        'UC_x5XG1OV2P6uYZ5FSM9P_Q', // T-Series (Bollywood)
        'UC-SCAQ9X0YdSe7_s_6S3S3A', // Zee Music
        'UC295C_H_C6v6L868qA7_A5g', // Goldmines (South)
        'UC62_itC68E_vE8_X_f5p9Ew', // Worldwide Records (Bhojpuri)
        'UCf6uB06VvPsp6pY_pW_vjYg', // Wave Music
        'UC8I8U89Xz8X7C2W2pQ_X0Yg', // Speed Records (Punjabi)
        'UC_3WvA7A_M7X_rGgN5j_y_Q', // Sony Pictures (Hollywood)
        'UC6-F5tGu266_A668X79W0vA', // Sony PAL (Serials)
        'UC87S_7O8Y_v_tq7N4O_L1_w', // Dangal TV
        'UCX52tYZiEHhote-Uu_S_ZpA'  // Movie Library
    ];

    let masterLibrary = [];

    async function loadMahaLibrary() {
        const feed = document.getElementById('video-feed');
        
        for (let id of channelList) {
            try {
                const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${id}`;
                const fetchUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
                const response = await fetch(fetchUrl);
                const data = await response.json();
                if(data.items) {
                    masterLibrary = [...masterLibrary, ...data.items];
                }
            } catch (e) { console.log("Slow Connection..."); }
        }

        // Mix everything for the 100-200 video feel
        masterLibrary.sort(() => Math.random() - 0.5);
        renderVideos(masterLibrary);
    }

    function renderVideos(videos) {
        const feed = document.getElementById('video-feed');
        feed.innerHTML = ''; 
        videos.forEach(item => {
            const videoId = item.guid.split(':').pop(); 
            feed.innerHTML += `
                <div class="video-item" onclick="location.href='player.html?v=${videoId}'">
                    <div class="thumb-wrap">
                        <img src="${item.thumbnail}" loading="lazy">
                    </div>
                    <div class="video-info">
                        <div class="chan-img"></div>
                        <div class="title-box">
                            <div class="v-title">${item.title}</div>
                            <div class="v-meta">Zab-Tube Maha Library • Trending</div>
                        </div>
                    </div>
                </div>`;
        });
    }

    // Search Feature
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = masterLibrary.filter(v => v.title.toLowerCase().includes(term));
        renderVideos(filtered);
    });

    window.onload = loadMahaLibrary;
    </script>
</body>
</html>
