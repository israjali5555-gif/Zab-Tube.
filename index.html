<body>
    <header>
        <div class="logo"><span>●</span> Zab-Tube</div>
        <div class="header-icons">
            <span style="color: white; font-size: 18px; margin-left: 15px;">🔍</span>
            <span style="color: white; font-size: 18px; margin-left: 15px;">🔔</span>
            <span style="color: white; font-size: 18px; margin-left: 15px;">👤</span>
        </div>
    </header>

    <div class="categories">
        <div class="chip active">All</div>
        <div class="chip">Music</div>
        <div class="chip">Bhojpuri</div>
        <div class="chip">South</div>
        <div class="chip">Punjabi</div>
    </div>

    <div class="main-feed" id="video-feed" style="padding-bottom: 80px;">
        </div>

    <div class="bottom-bar">
        <a href="index.html" class="nav-tab active">🏠<br><span style="font-size:10px">Home</span></a>
        <a href="shorts.html" class="nav-tab">⚡<br><span style="font-size:10px">Shorts</span></a>
        <div class="nav-tab" style="font-size:30px">+</div>
        <a href="#" class="nav-tab">📺<br><span style="font-size:10px">Subs</span></a>
        <a href="you.html" class="nav-tab">👤<br><span style="font-size:10px">You</span></a>
    </div>

<script>
async function loadMahaLibrary() {
    const feed = document.getElementById('video-feed');
    feed.innerHTML = '<p style="color:white; text-align:center; padding:20px;">Maha Library load ho rahi hai...</p>';

    // Saare Bade Channels (Bollywood, South, Punjabi, Bhojpuri, Hollywood)
    const channels = [
        'UC_x5XG1OV2P6uYZ5FSM9P_Q', 'UC-SCAQ9X0YdSe7_s_6S3S3A', // Bollywood
        'UC295C_H_C6v6L868qA7_A5g', 'UCX52tYZiEHhote-Uu_S_ZpA', // South
        'UC62_itC68E_vE8_X_f5p9Ew', 'UCf6uB06VvPsp6pY_pW_vjYg', // Bhojpuri
        'UC8I8U89Xz8X7C2W2pQ_X0Yg', 'UC9K66pZ_iM-44_M3A_K_v7A'  // Punjabi & Hollywood
    ];

    let allVideos = [];

    for (let id of channels) {
        try {
            const fetchUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id=' + id)}`;
            const response = await fetch(fetchUrl);
            const data = await response.json();
            if(data.items) allVideos = [...allVideos, ...data.items];
        } catch (e) { console.log("Slow connection"); }
    }

    // Videos ko mix karna taaki 100-200 videos ka maza aaye
    allVideos.sort(() => Math.random() - 0.5);

    feed.innerHTML = ''; 
    allVideos.forEach(item => {
        const videoId = item.guid.split(':').pop(); 
        feed.innerHTML += `
            <div class="video-item" onclick="location.href='player.html?v=${videoId}'" style="margin-bottom:20px; cursor:pointer;">
                <img src="${item.thumbnail}" style="width:100%; border-radius:12px;">
                <div style="display:flex; padding:12px; gap:12px;">
                    <div style="width:36px; height:36px; border-radius:50%; background:#444;"></div>
                    <div>
                        <div style="color:white; font-weight:bold; font-size:14px;">${item.title}</div>
                        <div style="color:#aaa; font-size:12px; margin-top:4px;">Zab-Tube Maha Library</div>
                    </div>
                </div>
            </div>`;
    });
}
window.onload = loadMahaLibrary;
</script>
</body>
</html>
